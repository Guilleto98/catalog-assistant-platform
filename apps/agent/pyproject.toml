[project]
name = "solvo-client-agent"
version = "0.1.0"
description = "Catalog assistant and authenticated Application API built with Google ADK for a Solvo client"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "google-adk==2.10.0",
  "httpx>=0.28,<0.29",
  "litellm>=1.84,<2",
  "openai>=2.54,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "reportlab>=4.4,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a locally running Catalog API",
  "smoke: requires OpenAI credentials and a locally running Catalog API",
  "live: requires OpenAI credentials and may consume paid API quota",
]
