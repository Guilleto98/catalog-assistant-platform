services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/prisma/data/dev.db
      PORT: 3000
    volumes:
      - catalog_sqlite:/app/prisma/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  catalog_sqlite:
